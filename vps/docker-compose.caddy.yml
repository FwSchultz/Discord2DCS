services:
  discord2dcs:
    build: .
    container_name: discord2dcs
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${WS_PORT:-8766}"
    volumes:
      - ./certs:/certs:ro
      - ./data:/data

  caddy:
    image: caddy:2-alpine
    container_name: discord2dcs-caddy
    restart: unless-stopped
    depends_on:
      - discord2dcs
    env_file:
      - .env
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
